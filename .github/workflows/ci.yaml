name: CI

on:
  push:
    branches: [main]


jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --locked
      - name: Test
        run: uv run pytest -v

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Deploy
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes root@${{ secrets.SSH_HOST }} \
            "cd ~/resident-agent && git pull && docker compose up -d --build"
    smoke-test:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Ask the bot a question
        run: |
          curl -sf --retry 10 --retry-delay 5 --retry-all-errors \
            -X POST http://${{ secrets.SSH_HOST }}:8000/chat \
            -H "Content-Type: application/json" \
            -d '{"question":"اوقات الهدوء في الكمبوند؟","app_code":"cityeyeprod","compound_id":17,"language_code":"ar"}'